name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Copier la page dans l'application
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Construire l'APK
        run: gradle assembleDebug -Pvc=${{ github.run_number }}

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mobox.apk
          gh release create "v${{ github.run_number }}" mobox.apk --repo "${{ github.repository }}" --title "Mobox v${{ github.run_number }}" --notes "Installe mobox.apk" --latest
