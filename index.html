<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07132f">
<title>Mobox Desktop — Bureau</title>
<style>
:root{--panel:#171d2b;--panel2:#252c3d;--text:#f4f7ff;--accent:#48a9ff;--win:#f4f6fb;--wintext:#202535;--line:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden}
body{font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;background:#06112b;color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent}
.desktop{position:fixed;inset:0;background:
radial-gradient(ellipse 24% 40% at 60% 64%,#2876ff 0%,transparent 72%),
radial-gradient(ellipse 20% 32% at 73% 48%,#174bd0 0%,transparent 74%),
radial-gradient(ellipse 68% 90% at 50% 40%,#0d2a68 0%,#050b1c 78%)}
.icons{position:absolute;top:max(7px,env(safe-area-inset-top));left:7px;display:grid;grid-auto-flow:row;grid-template-columns:repeat(2,minmax(58px,72px));gap:5px;z-index:2}
.icon{min-height:62px;padding:5px 3px;border:1px solid transparent;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;font-size:10px;line-height:1.1;color:#fff;text-shadow:0 1px 3px #000;cursor:pointer}
.icon .glyph{font-size:25px;line-height:1.1}
.icon:active,.icon.selected{background:#ffffff25;border-color:#ffffff35}
.taskbar{position:absolute;left:0;right:0;bottom:0;min-height:43px;padding:4px max(7px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:5px;background:rgba(20,25,38,.91);border-top:1px solid #ffffff18;backdrop-filter:blur(18px);z-index:1000}
.task-left,.task-center,.tray{display:flex;align-items:center;gap:4px;min-width:0}
.task-center{position:absolute;left:50%;transform:translateX(-50%);gap:5px}
.tb{width:32px;height:32px;flex:0 0 32px;border:0;border-radius:6px;background:transparent;color:white;font-size:17px;display:grid;place-items:center}
.tb:active{background:#ffffff20}
.logo{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;width:17px;height:17px}
.logo i{background:#3b9fff;border-radius:1px}
.searchbox{width:clamp(105px,30vw,210px);height:29px;border-radius:18px;background:#ffffff18;display:flex;align-items:center;gap:7px;padding:0 10px;color:#e3e9f7;font-size:12px}
.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:white;font:inherit}
.tray{font-size:12px;gap:7px}
.clock{text-align:right;font-size:10px;line-height:1.25;white-space:nowrap}
.start{position:absolute;z-index:1100;left:50%;bottom:calc(50px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(330px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;padding:12px;border:1px solid #ffffff22;border-radius:13px;background:rgba(25,31,47,.97);box-shadow:0 14px 42px #0008;display:none}
.start.open{display:block}
.start h3{font-size:13px;margin:0 0 8px}
.app-list{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.app-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:12px}
.app-item:active{background:#ffffff20}
.app-item span:first-child{font-size:21px}
.window{position:absolute;z-index:20;left:3vw;top:4vh;width:94vw;height:calc(100dvh - 58px);max-height:calc(100dvh - 58px);border-radius:10px;overflow:hidden;background:var(--win);color:var(--wintext);box-shadow:0 14px 45px #0008;display:flex;flex-direction:column;border:1px solid #0002}
.window.max{left:0!important;top:0!important;width:100vw!important;height:calc(100dvh - 47px)!important;max-height:none;border-radius:0}
.winbar{height:34px;min-height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;background:#e5e9f1;font-size:12px;touch-action:pan-y}
.win-title{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap}
.win-actions{display:flex;gap:3px}
.win-action{width:27px;height:25px;border:0;border-radius:5px;background:transparent;color:#202535;font-size:13px}
.win-action:active{background:#cbd3e2}
.win-action.close:active{background:#e5484d;color:#fff}
.winbody{padding:12px;overflow:auto;flex:1;font-size:12px;line-height:1.45}
.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbtn,.primary{border:1px solid #d5dbe6;background:#fff;color:#273044;border-radius:7px;padding:7px 9px;font-size:11px}
.primary{background:#1676d2;color:#fff;border-color:#1676d2}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.filetile{padding:11px 5px;border:1px solid #e1e5ed;border-radius:8px;text-align:center;background:#fff;font-size:11px}
.filetile b{display:block;font-size:25px;margin-bottom:5px}
.address{width:100%;padding:8px 10px;border:1px solid #d7deea;border-radius:18px;background:#fff;color:#263044;font-size:12px}
.note{padding:10px;border-radius:8px;background:#eaf3ff;color:#244a70;margin:8px 0}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e2e6ed}
.hidden{display:none!important}
@media(max-width:520px){.icons{grid-template-columns:repeat(2,64px)}.task-center{gap:2px}.searchbox{width:clamp(88px,28vw,145px)}.tray{gap:5px}.task-left>.tb:nth-child(2){display:none}}
@media(orientation:portrait){.icons{grid-template-columns:repeat(3,60px);top:max(5px,env(safe-area-inset-top))}.icon{min-height:55px}.taskbar{min-height:45px}.task-center{left:47%}.searchbox{width:clamp(80px,25vw,130px)}.window{left:2vw;top:2vh;width:96vw;height:calc(100dvh - 57px)}}
</style>
</head>
<body>
<div class="desktop" id="desktop"></div>
<div class="icons" id="icons"></div>

<div class="start" id="start">
  <h3>Applications</h3>
  <div class="app-list" id="appList"></div>
  <div class="note">Bureau Mobox — interface de démonstration. L’exécution des fichiers Windows (.exe) nécessite un moteur compatible séparé.</div>
</div>

<div class="taskbar">
  <div class="task-left">
    <button class="tb" title="Vue des tâches" onclick="showAbout()">▦</button>
  </div>
  <div class="task-center">
    <button class="tb" id="startBtn" title="Démarrer"><span class="logo"><i></i><i></i><i></i><i></i></span></button>
    <label class="searchbox">⌕ <input id="search" placeholder="Rechercher" autocomplete="off"></label>
    <button class="tb" title="Explorateur" onclick="launch('pc')">📁</button>
    <button class="tb" title="Paramètres" onclick="launch('settings')">⚙</button>
  </div>
  <div class="tray">
    <span>⌁</span><span>◖</span><span>▰</span>
    <div class="clock"><div id="time"></div><div id="date"></div></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const apps=[
 {id:"pc",name:"Ce PC",icon:"🖥️"},
 {id:"inst",name:"Installateur",icon:"🧰"},
 {id:"chrome",name:"Navigateur",icon:"🌐"},
 {id:"settings",name:"Paramètres",icon:"⚙️"},
 {id:"about",name:"À propos",icon:"ℹ️"}
];
let z=30,offset=0;
function makeShortcuts(){
 apps.forEach(a=>{
  const d=document.createElement("button");d.className="icon";d.innerHTML=`<span class="glyph">${a.icon}</span><span>${a.name}</span>`;d.onclick=()=>launch(a.id);$("#icons").appendChild(d);
  const item=document.createElement("button");item.className="app-item";item.innerHTML=`<span>${a.icon}</span><span>${a.name}</span>`;item.onclick=()=>{ $("#start").classList.remove("open");launch(a.id);};$("#appList").appendChild(item);
 });
}
function content(id){
 if(id==="pc")return `<div class="toolbar"><button class="toolbtn">← Retour</button><button class="toolbtn">↑</button><span>Ce PC　›　Stockage</span></div><div class="filegrid"><div class="filetile"><b>💽</b>Disque local (C:)</div><div class="filetile"><b>📁</b>Bureau</div><div class="filetile"><b>📂</b>Documents</div><div class="filetile"><b>⬇️</b>Téléchargements</div><div class="filetile"><b>🖼️</b>Images</div><div class="filetile"><b>🎵</b>Musique</div></div><p class="note">Explorateur visuel : les dossiers réels du téléphone ne sont pas encore reliés à cette interface.</p>`;
 if(id==="inst")return `<h3>Installateur de programmes</h3><p>Ajoute ici les installateurs compatibles avec le moteur Windows qui sera intégré au projet.</p><div class="note">Aucun programme n’est installé pour le moment. Cette fenêtre est une maquette et ne lance pas les fichiers .exe.</div><button class="primary" onclick="alert('Le moteur d’installation n’est pas encore intégré.')">Choisir un fichier</button>`;
 if(id==="chrome")return `<h3>Navigateur</h3><form class="toolbar" onsubmit="event.preventDefault();browse(this.url.value)"><input class="address" name="url" placeholder="Rechercher sur le Web ou saisir une adresse"><button class="primary">Ouvrir</button></form><div class="note">La navigation dépend des autorisations et de la configuration de la WebView Android.</div><button class="toolbtn" onclick="browse('https://www.google.com')">Ouvrir Google</button>`;
 if(id==="settings")return `<h3>Paramètres</h3><div class="setting-row"><span>Thème</span><button class="toolbtn" onclick="toggleTheme()">Basculer clair/sombre</button></div><div class="setting-row"><span>Affichage</span><span>Plein écran adaptatif</span></div><div class="setting-row"><span>Interface</span><span>Compacte</span></div><div class="setting-row"><span>Version</span><span>Mobox Desktop V2</span></div>`;
 return `<h3>Mobox Desktop V2</h3><p>Interface de bureau inspirée de Windows, optimisée pour les écrans Android.</p><p>Les fenêtres, le menu Démarrer, la recherche locale et les réglages sont interactifs.</p><div class="note">Ce bureau HTML ne constitue pas Windows et ne peut pas exécuter seul les logiciels .exe.</div>`;
}
function launch(id){
 const a=apps.find(x=>x.id===id)||apps[4];const w=document.createElement("section");w.className="window";w.style.zIndex=++z;
 w.style.left=`${Math.max(0,3+offset*2)}vw`;w.style.top=`${Math.max(0,3+offset*2)}vh`;offset=(offset+1)%8;
 w.innerHTML=`<div class="winbar"><div class="win-title"><span>${a.icon}</span><strong>${a.name}</strong></div><div class="win-actions"><button class="win-action minimize" title="Réduire">—</button><button class="win-action maximize" title="Agrandir">□</button><button class="win-action close" title="Fermer">✕</button></div></div><div class="winbody">${content(id)}</div>`;
 w.querySelector(".close").onclick=()=>w.remove();
 w.querySelector(".minimize").onclick=()=>w.classList.add("hidden");
 w.querySelector(".maximize").onclick=()=>w.classList.toggle("max");
 w.addEventListener("pointerdown",()=>w.style.zIndex=++z);
 const bar=w.querySelector(".winbar");let drag=false,dx=0,dy=0;
 bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||w.classList.contains("max"))return;drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;bar.setPointerCapture(e.pointerId)});
 bar.addEventListener("pointermove",e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-dx))+"px";w.style.top=Math.max(0,Math.min(innerHeight-w.offsetHeight-45,e.clientY-dy))+"px"});
 bar.addEventListener("pointerup",()=>drag=false);bar.addEventListener("pointercancel",()=>drag=false);
 document.body.appendChild(w);
}
function browse(value){let v=(value||"").trim();if(!v)return;if(!/^https?:\/\//i.test(v))v=/\s/.test(v)?"https://www.google.com/search?q="+encodeURIComponent(v):"https://"+v;window.open(v,"_blank");}
function toggleTheme(){const root=document.documentElement;const dark=root.dataset.theme!=="light";root.dataset.theme=dark?"light":"dark";document.body.style.background=dark?"#e9edf5":"#06112b";alert("Thème modifié pour cette session.");}
function showAbout(){launch("about")}
$("#startBtn").onclick=()=>$("#start").classList.toggle("open");
document.addEventListener("click",e=>{if(!e.target.closest("#start")&&!e.target.closest("#startBtn"))$("#start").classList.remove("open")});
$("#search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();$("#start").classList.add("open");document.querySelectorAll(".app-item").forEach((el,i)=>el.classList.toggle("hidden",!apps[i].name.toLowerCase().includes(q)))});
function tick(){const d=new Date();$("#time").textContent=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString("fr-FR");}
makeShortcuts();tick();setInterval(tick,15000);
</script>
</body>
</html>
