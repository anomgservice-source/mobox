plugins {
    id 'com.android.application'
}

def vc = (project.findProperty('vc') ?: '1').toInteger()

android {
    namespace 'com.anomg.mobox'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anomg.mobox'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.${vc}"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
